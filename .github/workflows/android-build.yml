name: XGrid Yellow Native APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: yellow-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK Platform 35 using GitHub runner's Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager missing under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore verified official Gradle wrapper
        run: |
          bash scripts/restore-gradle-wrapper.sh
          if ! git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradle/wrapper/gradle-wrapper.jar
            git commit -m "build: add verified Gradle 8.11.1 wrapper JAR"
            git push || echo "Could not persist wrapper JAR; run the restore script locally if needed."
          fi

      - name: Generate compile-only preserved-browser application stub
        run: |
          mkdir -p /tmp/blue-stub/com/mmbox/xbrowser app/libs
          cat > /tmp/blue-stub/com/mmbox/xbrowser/Browser.java <<'JAVA'
          package com.mmbox.xbrowser;
          public class Browser extends android.app.Application {}
          JAVA
          javac -cp "${ANDROID_HOME}/platforms/android-35/android.jar" -d /tmp/blue-stub/classes /tmp/blue-stub/com/mmbox/xbrowser/Browser.java
          jar cf app/libs/xbrowser-compile-only.jar -C /tmp/blue-stub/classes .

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yellow-native-v28.3.8-accuracy
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
